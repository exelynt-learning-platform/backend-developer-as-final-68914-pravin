spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/booking_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

app:
  jwt:
    secret: ${JWT_SECRET:cmVzb3VyY2VCb29raW5nU3lzdGVtU2VjcmV0S2V5Rm9ySlhUQXV0aGVudGljYXRpb24yMDI0}
    expiration: ${JWT_EXPIRATION:86400000}

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs